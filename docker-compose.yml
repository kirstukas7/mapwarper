services:
  db:
    # Rails 4.2 does not work with PostgreSQL 12+ (pg_attrdef.adsrc was removed).
    # imresamu/postgis is the multi-arch (amd64 + arm64) build of postgis/postgis,
    # which only ships amd64.
    image: imresamu/postgis:11-3.3
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mapwarper_production}
      POSTGRES_USER: ${DB_USER:-mapwarper}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory ${REDIS_MAXMEMORY:-512mb} --maxmemory-policy allkeys-lru

  app:
    # Built and published by .github/workflows/docker-image.yml.
    # To build on the server instead, run: docker build -t mapwarper:local .
    # and set MAPWARPER_IMAGE=mapwarper:local in .env.
    image: ${MAPWARPER_IMAGE:?set MAPWARPER_IMAGE in .env}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-mapwarper_production}
      DB_USER: ${DB_USER:-mapwarper}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_CACHE_URL: redis://redis:6379/0/cache
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE in .env}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      TILE_CACHE_MAX_AGE: ${TILE_CACHE_MAX_AGE:-86400}
      SMTP_ADDRESS: ${SMTP_ADDRESS:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    volumes:
      - ./docker/application.yml:/app/config/application.yml:ro
      - uploads:/app/public/uploads
      - system:/app/public/system
      - mapimages:/app/public/mapimages
      - maptileindex:/app/db/maptileindex
      - imports:/app/db/imports
    expose:
      - "3000"
    networks:
      - default
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      - traefik.http.routers.mapwarper.rule=Host(`${DOMAIN:?set DOMAIN in .env}`)
      - traefik.http.routers.mapwarper.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.mapwarper.tls=true
      - traefik.http.routers.mapwarper.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.mapwarper.loadbalancer.server.port=3000

networks:
  # The existing network your Traefik container is attached to.
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}

volumes:
  db_data:
  uploads:
  system:
  mapimages:
  maptileindex:
  imports:
